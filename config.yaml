# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: ens-indexer
disable_default_cross_chain: true # recommended; default in HyperIndex v4
description: ENS Protocol Indexer

contracts:
  # ─── Registry Contracts ──────────────────────────────────────────────────────
  - name: RegistryOld
    events:
      - event: "NewOwner(bytes32 indexed node, bytes32 indexed label, address owner)"
        field_selection:
          transaction_fields:
            - hash
      - event: "Transfer(bytes32 indexed node, address owner)"
        field_selection:
          transaction_fields:
            - hash
      - event: "NewResolver(bytes32 indexed node, address resolver)"
        field_selection:
          transaction_fields:
            - hash
      - event: "NewTTL(bytes32 indexed node, uint64 ttl)"
        field_selection:
          transaction_fields:
            - hash

  - name: Registry
    events:
      - event: "NewOwner(bytes32 indexed node, bytes32 indexed label, address owner)"
        field_selection:
          transaction_fields:
            - hash
      - event: "Transfer(bytes32 indexed node, address owner)"
        field_selection:
          transaction_fields:
            - hash
      - event: "NewResolver(bytes32 indexed node, address resolver)"
        field_selection:
          transaction_fields:
            - hash
      - event: "NewTTL(bytes32 indexed node, uint64 ttl)"
        field_selection:
          transaction_fields:
            - hash

  # ─── BaseRegistrar ──────────────────────────────────────────────────────────
  - name: BaseRegistrar
    events:
      - event: "NameRegistered(uint256 indexed id, address indexed owner, uint256 expires)"
        field_selection:
          transaction_fields:
            - hash
            - from
      - event: "NameRenewed(uint256 indexed id, uint256 expires)"
        field_selection:
          transaction_fields:
            - hash
            - from
      - event: "Transfer(address indexed from, address indexed to, uint256 indexed tokenId)"
        field_selection:
          transaction_fields:
            - hash

  # ─── NameWrapper ─────────────────────────────────────────────────────────────
  - name: NameWrapper
    events:
      - event: "NameWrapped(bytes32 indexed node, bytes name, address owner, uint32 fuses, uint64 expiry)"
        field_selection:
          transaction_fields:
            - hash
      - event: "NameUnwrapped(bytes32 indexed node, address owner)"
        field_selection:
          transaction_fields:
            - hash
      - event: "FusesSet(bytes32 indexed node, uint32 fuses)"
        field_selection:
          transaction_fields:
            - hash
      - event: "ExpiryExtended(bytes32 indexed node, uint64 expiry)"
        field_selection:
          transaction_fields:
            - hash
      - event: "TransferSingle(address indexed operator, address indexed from, address indexed to, uint256 id, uint256 value)"
        field_selection:
          transaction_fields:
            - hash
      - event: "TransferBatch(address indexed operator, address indexed from, address indexed to, uint256[] ids, uint256[] values)"
        field_selection:
          transaction_fields:
            - hash

  # ─── Registrar Controllers ──────────────────────────────────────────────────
  - name: LegacyController
    events:
      - event: "NameRegistered(string name, bytes32 indexed label, address indexed owner, uint256 cost, uint256 expires)"
        field_selection:
          transaction_fields:
            - hash
      - event: "NameRenewed(string name, bytes32 indexed label, uint256 cost, uint256 expires)"
        field_selection:
          transaction_fields:
            - hash

  - name: WrappedController
    events:
      - event: "NameRegistered(string name, bytes32 indexed label, address indexed owner, uint256 baseCost, uint256 premium, uint256 expires)"
        field_selection:
          transaction_fields:
            - hash
      - event: "NameRenewed(string name, bytes32 indexed label, uint256 cost, uint256 expires)"
        field_selection:
          transaction_fields:
            - hash

  - name: UnwrappedController
    events:
      - event: "NameRegistered(string label, bytes32 indexed labelhash, address indexed owner, uint256 baseCost, uint256 premium, uint256 expires, bytes32 referrer)"
        field_selection:
          transaction_fields:
            - hash
      - event: "NameRenewed(string label, bytes32 indexed labelhash, uint256 cost, uint256 expires, bytes32 referrer)"
        field_selection:
          transaction_fields:
            - hash

  # ─── Base L2 Contracts ─────────────────────────────────────────────────────
  - name: BaseRegistrar_Base
    events:
      - event: "NameRegistered(uint256 indexed id, address indexed owner, uint256 expires)"
        field_selection:
          transaction_fields:
            - hash
            - from
      - event: "NameRegisteredWithRecord(uint256 indexed id, address indexed owner, uint256 expires, address resolver, uint64 ttl)"
        field_selection:
          transaction_fields:
            - hash
            - from
      - event: "NameRenewed(uint256 indexed id, uint256 expires)"
        field_selection:
          transaction_fields:
            - hash
            - from
      - event: "Transfer(address indexed from, address indexed to, uint256 indexed tokenId)"
        field_selection:
          transaction_fields:
            - hash

  - name: EAController_Base
    events:
      - event: "ETHPaymentProcessed(address indexed payee, uint256 price)"
        field_selection:
          transaction_fields:
            - hash
      - event: "NameRegistered(string name, bytes32 indexed label, address indexed owner, uint256 expires)"
        field_selection:
          transaction_fields:
            - hash

  - name: RegController_Base
    events:
      - event: "ETHPaymentProcessed(address indexed payee, uint256 price)"
        field_selection:
          transaction_fields:
            - hash
      - event: "NameRegistered(string name, bytes32 indexed label, address indexed owner, uint256 expires)"
        field_selection:
          transaction_fields:
            - hash
      - event: "NameRenewed(string name, bytes32 indexed label, uint256 expires)"
        field_selection:
          transaction_fields:
            - hash

  - name: UpgController_Base
    events:
      - event: "ETHPaymentProcessed(address indexed payee, uint256 price)"
        field_selection:
          transaction_fields:
            - hash
      - event: "NameRegistered(string name, bytes32 indexed label, address indexed owner, uint256 expires)"
        field_selection:
          transaction_fields:
            - hash
      - event: "NameRenewed(string name, bytes32 indexed label, uint256 expires)"
        field_selection:
          transaction_fields:
            - hash

  # ─── Linea L2 Contracts ────────────────────────────────────────────────────
  - name: BaseRegistrar_Linea
    events:
      - event: "NameRegistered(uint256 indexed id, address indexed owner, uint256 expires)"
        field_selection:
          transaction_fields:
            - hash
            - from
      - event: "NameRenewed(uint256 indexed id, uint256 expires)"
        field_selection:
          transaction_fields:
            - hash
            - from
      - event: "Transfer(address indexed from, address indexed to, uint256 indexed tokenId)"
        field_selection:
          transaction_fields:
            - hash

  - name: EthController_Linea
    events:
      - event: "NameRegistered(string name, bytes32 indexed label, address indexed owner, uint256 baseCost, uint256 premium, uint256 expires)"
        field_selection:
          transaction_fields:
            - hash
      - event: "NameRenewed(string name, bytes32 indexed label, uint256 cost, uint256 expires)"
        field_selection:
          transaction_fields:
            - hash
      - event: "OwnerNameRegistered(string name, bytes32 indexed label, address indexed owner, uint256 expires)"
        field_selection:
          transaction_fields:
            - hash
      - event: "PohNameRegistered(string name, bytes32 indexed label, address indexed owner, uint256 expires)"
        field_selection:
          transaction_fields:
            - hash

  # ─── ThreeDNS Token (Optimism + Base) ──────────────────────────────────────
  - name: ThreeDNSToken
    events:
      - event: "NewOwner(bytes32 indexed node, bytes32 indexed label, address owner)"
        field_selection:
          transaction_fields:
            - hash
      - event: "Transfer(bytes32 indexed node, address owner)"
        field_selection:
          transaction_fields:
            - hash
      - event: "RegistrationCreated(bytes32 indexed node, bytes32 indexed tld, bytes fqdn, address registrant, uint32 controlBitmap, uint64 expiry)"
        field_selection:
          transaction_fields:
            - hash
      - event: "RegistrationExtended(bytes32 indexed node, uint64 indexed duration, uint64 indexed newExpiry)"
        field_selection:
          transaction_fields:
            - hash
            - from
      # ─── ERC1155 Transfer events (for TokenScope plugin) ──────────────────────
      - event: "TransferSingle(address indexed operator, address indexed from, address indexed to, uint256 id, uint256 value)"
        field_selection:
          transaction_fields:
            - hash
      - event: "TransferBatch(address indexed operator, address indexed from, address indexed to, uint256[] ids, uint256[] values)"
        field_selection:
          transaction_fields:
            - hash

  # ─── Resolver (dynamically registered via Registry.NewResolver) ─────────────
  - name: Resolver
    events:
      - event: "AddrChanged(bytes32 indexed node, address a)"
        field_selection:
          transaction_fields:
            - hash
      - event: "AddressChanged(bytes32 indexed node, uint256 coinType, bytes newAddress)"
        field_selection:
          transaction_fields:
            - hash
      - event: "NameChanged(bytes32 indexed node, string name)"
        field_selection:
          transaction_fields:
            - hash
            - from
      - event: "ABIChanged(bytes32 indexed node, uint256 indexed contentType)"
        field_selection:
          transaction_fields:
            - hash
      - event: "PubkeyChanged(bytes32 indexed node, bytes32 x, bytes32 y)"
        field_selection:
          transaction_fields:
            - hash
      - event: "TextChanged(bytes32 indexed node, string indexed indexedKey, string key, string value)"
        field_selection:
          transaction_fields:
            - hash
      - event: "ContenthashChanged(bytes32 indexed node, bytes hash)"
        field_selection:
          transaction_fields:
            - hash
      - event: "InterfaceChanged(bytes32 indexed node, bytes4 indexed interfaceID, address implementer)"
        field_selection:
          transaction_fields:
            - hash
      - event: "AuthorisationChanged(bytes32 indexed node, address indexed owner, address indexed target, bool isAuthorised)"
        field_selection:
          transaction_fields:
            - hash
      - event: "VersionChanged(bytes32 indexed node, uint64 newVersion)"
        field_selection:
          transaction_fields:
            - hash
      # ─── DNS Record Events (for PA plugin) ────────────────────────────────────
      - event: "DNSRecordChanged(bytes32 indexed node, bytes name, uint16 resource, bytes record)"
        name: DNSRecordChanged4
        field_selection:
          transaction_fields:
            - hash
      - event: "DNSRecordChanged(bytes32 indexed node, bytes name, uint16 resource, uint32 ttl, bytes record)"
        name: DNSRecordChanged5
        field_selection:
          transaction_fields:
            - hash
      - event: "DNSRecordDeleted(bytes32 indexed node, bytes name, uint16 resource)"
        field_selection:
          transaction_fields:
            - hash

  # ─── UniversalRenewal (Registrars plugin) ──────────────────────────────────
  - name: UniversalRenewal
    abi_file_path: ./abis/UniversalRegistrarRenewalWithReferrer.json
    handler: ./src/handlers/Registrar.ts
    events:
      - event: "RenewalReferred(string label, bytes32 indexed labelHash, uint256 cost, uint256 duration, bytes32 referrer)"
        field_selection:
          transaction_fields:
            - hash
            - from

  # ─── Seaport (TokenScope plugin) ───────────────────────────────────────────
  - name: Seaport
    abi_file_path: ./abis/Seaport1_5.json
    handler: ./src/handlers/TokenScope.ts
    events:
      - event: "OrderFulfilled(bytes32 orderHash, address indexed offerer, address indexed zone, address recipient, (uint8,address,uint256,uint256)[] offer, (uint8,address,uint256,uint256,address)[] consideration)"
        field_selection:
          transaction_fields:
            - hash

  # ─── ReverseRegistrar (legacy addr.reverse; mainnet only) ───────────────────
  # ReverseClaimed maps an address to its reverse node exactly, which covers
  # contract wallets and relayed calls that the hash-recovery fallback misses.
  - name: ReverseRegistrar
    events:
      - event: "ReverseClaimed(address indexed addr, bytes32 indexed node)"
        field_selection:
          transaction_fields:
            - hash

  # ─── StandaloneReverseRegistrar (PA plugin) ────────────────────────────────
  - name: StandaloneReverseRegistrar
    events:
      - event: "NameForAddrChanged(address indexed addr, string name)"
        field_selection:
          transaction_fields:
            - hash

# ─── Chain Configuration ───────────────────────────────────────────────────────
  # ─── ENSv2 ───────────────────────────────────────────────────────────────────
  # Addresses and ABIs: ensdomains/contracts-v2, branch deploy/mainnet-v2-20261002,
  # commit 0f10caf5, contracts/deployments/{mainnet,sepolia}. See src/lib/v2-deployments.ts.
  #
  # The two discovery contracts have no address on any chain: they are wildcard
  # listeners for the signals every PermissionedRegistry and PermissionedResolver
  # emits when it is created. Discovery at creation (not at first link) means no
  # event is lost when a contract is used before its parent points at it. A
  # discovered contract stays unproven until a proven parent links to it.
  - name: V2RegistryDiscovery
    events:
      - event: "RegistryCreated()"

  - name: V2ResolverDiscovery
    events:
      - event: "ResolverCreated()"

  - name: V2Registry
    events:
      - event: "LabelRegistered(uint256 indexed tokenId, bytes32 indexed labelHash, string label, address owner, uint64 expiry, address indexed sender)"
        field_selection:
          transaction_fields:
            - hash
      - event: "LabelReserved(uint256 indexed tokenId, bytes32 indexed labelHash, string label, uint64 expiry, address indexed sender)"
        field_selection:
          transaction_fields:
            - hash
      - event: "LabelUnregistered(uint256 indexed tokenId, address indexed sender)"
        field_selection:
          transaction_fields:
            - hash
      - event: "ExpiryUpdated(uint256 indexed tokenId, uint64 indexed newExpiry, address indexed sender)"
        field_selection:
          transaction_fields:
            - hash
      - event: "SubregistryUpdated(uint256 indexed tokenId, address indexed subregistry, address indexed sender)"
        field_selection:
          transaction_fields:
            - hash
      - event: "ResolverUpdated(uint256 indexed tokenId, address indexed resolver, address indexed sender)"
        field_selection:
          transaction_fields:
            - hash
      - event: "ParentUpdated(address indexed parent, string label, address indexed sender)"
        field_selection:
          transaction_fields:
            - hash
      - event: "TokenRegenerated(uint256 indexed oldTokenId, uint256 indexed newTokenId)"
        field_selection:
          transaction_fields:
            - hash
      - event: "TokenResource(uint256 indexed tokenId, uint256 indexed resource)"
        field_selection:
          transaction_fields:
            - hash
      - event: "EACRolesChanged(uint256 indexed resource, address indexed account, uint256 oldRoleBitmap, uint256 newRoleBitmap)"
        field_selection:
          transaction_fields:
            - hash
      - event: "TransferSingle(address indexed operator, address indexed from, address indexed to, uint256 id, uint256 value)"
        field_selection:
          transaction_fields:
            - hash
      - event: "TransferBatch(address indexed operator, address indexed from, address indexed to, uint256[] ids, uint256[] values)"
        field_selection:
          transaction_fields:
            - hash

  # Node-keyed (v1-style) record events, matched on any address from the ENSv2
  # start block. A v2 registry can point at a resolver of this kind; matching by
  # signature keeps its records even if HyperIndex registers the address late.
  # Read only for resolvers a proven v2 domain points at.
  - name: V2NodeResolver
    events:
      - event: "AddrChanged(bytes32 indexed node, address a)"
      - event: "AddressChanged(bytes32 indexed node, uint256 coinType, bytes newAddress)"
      - event: "TextChanged(bytes32 indexed node, string indexed indexedKey, string key, string value)"
      - event: "ContenthashChanged(bytes32 indexed node, bytes hash)"
      - event: "NameChanged(bytes32 indexed node, string name)"

  # ETHRegistrar and ETHRenewerV1. Both emit NameRenewed with this signature.
  - name: V2Registrar
    events:
      - event: "NameRegistered(uint256 indexed tokenId, string label, address owner, address subregistry, address resolver, uint64 duration, address paymentToken, bytes32 indexed referrer, uint256 base, uint256 premium)"
        field_selection:
          transaction_fields:
            - hash
      - event: "NameRenewed(uint256 indexed tokenId, string label, uint64 duration, uint64 newExpiry, address paymentToken, bytes32 indexed referrer, uint256 amount)"
        field_selection:
          transaction_fields:
            - hash

  # Record events from PermissionedResolver. Resolvers are added here and to the
  # node-keyed `Resolver` contract, so a custom resolver is covered by whichever
  # event family it emits.
  - name: V2Resolver
    events:
      - event: "Linked(uint256 indexed recordId, bytes32 indexed node, bytes name)"
      - event: "Cleared(uint256 indexed recordId)"
      - event: "AddressUpdated(uint256 indexed recordId, uint256 coinType, bytes addressBytes)"
      - event: "TextUpdated(uint256 indexed recordId, string indexed keyHash, string key, string value)"
      - event: "ContenthashUpdated(uint256 indexed recordId, bytes hash)"
      - event: "NameUpdated(uint256 indexed recordId, string primaryName)"
      - event: "DataUpdated(uint256 indexed recordId, string indexed keyHash, string key, bytes value)"
      - event: "ABIUpdated(uint256 indexed recordId, uint256 indexed contentType)"
      - event: "InterfaceUpdated(uint256 indexed recordId, bytes4 indexed interfaceId, address implementer)"
      # Emitted by deployments before 2026-09 (contracts/deployments/sepolia-*). Later ones use Linked.
      - event: "AliasChanged(bytes indexed indexedFromName, bytes indexed indexedToName, bytes fromName, bytes toName)"

