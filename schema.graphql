# ENS HyperIndex Schema
# Migrated from ENSNode Ponder indexer (subgraph plugin)

# ─── Core Entities ───────────────────────────────────────────────────────────

type Domain {
  id: ID!
  name: String
  labelName: String
  labelhash: String
  parent: Domain
  subdomainCount: Int!
  resolvedAddress: Account
  resolver: Resolver
  ttl: BigInt
  isMigrated: Boolean!
  createdAt: BigInt!
  owner: Account!
  registrant: Account
  wrappedOwner: Account
  expiryDate: BigInt
  subdomains: [Domain!]! @derivedFrom(field: "parent")
}

type Account {
  id: ID!
  domains: [Domain!]! @derivedFrom(field: "owner")
  wrappedDomains: [WrappedDomain!]! @derivedFrom(field: "owner")
  registrations: [Registration!]! @derivedFrom(field: "registrant")
}

type Resolver {
  id: ID!
  domain: Domain!
  address: String!
  addr: Account
  contentHash: String
  texts: [String!]
  coinTypes: [BigInt!]
}

type Registration {
  id: ID!
  domain: Domain!
  registrationDate: BigInt!
  expiryDate: BigInt!
  cost: BigInt
  registrant: Account!
  labelName: String
}

type WrappedDomain {
  id: ID!
  domain: Domain!
  expiryDate: BigInt!
  fuses: Int!
  owner: Account!
  name: String
  isActive: Boolean!
}

