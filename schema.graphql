}

type NewTTL @index(fields: ["domain", "id"]) {
  id: ID!
  blockNumber: Int!
  transactionID: String!
  domain: Domain! @index
  ttl: BigInt!
}

type WrappedTransfer @index(fields: ["domain", "id"]) {
  id: ID!
