  domainId: String!
  resolver: String!
}

type reverse_name_record @index(fields: ["address", "coinType"]) {
  id: ID!
  address: String!
  coinType: BigInt!
  value: String!
}

type migrated_node_by_node {
  id: ID!
}

# ─── Registrars Plugin Entities ────────────────────────────────────────────

enum registrar_action_type {
  registration
  renewal
}

type subregistry {
  id: ID!                    # CAIP-10: "eip155:{chainId}:{address}"
  node: String! @index       # namehash of managed name (e.g. ETH_NODE)
}

type registration_lifecycle {
  id: ID!                    # node hash (domain namehash)
  subregistryId: String! @index  # FK to subregistry
  expiresAt: BigInt!         # Unix timestamp
}

type registrar_action {
  id: ID!                    # first event ID (from BaseRegistrar event)
  type: registrar_action_type!
  subregistryId: String!     # FK to subregistry
  node: String!              # domain namehash
  incremental_duration: BigInt!
  baseCost: BigInt           # nullable (unknown for some controllers)
  premium: BigInt            # nullable
  total: BigInt              # nullable
  registrant: String!        # transaction.from address
  encodedReferrer: String    # nullable, raw bytes32
  decodedReferrer: String @index  # nullable, decoded address
  blockNumber: BigInt!
  timestamp: BigInt! @index
  transactionHash: String!
  eventIds: [String!]!       # array of contributing event IDs
}

type internal_registrar_action_metadata {
  id: ID!                    # always "current" (singleton)
  logicalEventKey: String!   # "{node}:{transactionHash}"
  logicalEventId: String!    # ID of registrarAction being built
}

# ─── TokenScope Plugin Entities ──────────────────────────────────────────

type name_token {
  id: ID!                    # CAIP-19 Asset ID
  domainId: String! @index   # namehash (node) of the ENS domain
  contractAddress: String!   # NFT contract address
  tokenId: BigInt!           # token ID in the contract
  assetNamespace: String!    # "erc721" or "erc1155"
  owner: String! @index      # current owner (zeroAddress if burned)
  mintStatus: String!        # "minted" or "burned"
}

type name_sale {
  id: ID!                    # "{chainId}-{blockNumber}-{logIndex}"
  blockNumber: Int!
  logIndex: Int!
  transactionHash: String!
  orderHash: String!
  contractAddress: String!
  tokenId: BigInt!
  assetNamespace: String!
  assetId: String! @index    # CAIP-19 Asset ID
  domainId: String! @index   # namehash (node)
  buyer: String! @index
  seller: String! @index
  currency: String!          # "ETH", "USDC", "DAI"
  amount: BigInt!            # smallest unit
  timestamp: BigInt! @index
}
