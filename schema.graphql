# ENS HyperIndex Schema
# Migrated from ENSNode Ponder indexer (subgraph plugin)

# ─── Core Entities ───────────────────────────────────────────────────────────

type subgraph_domains {
  id: ID!
  name: String
  label_name: String
  labelhash: String @index
  parent: subgraph_domains @index
  subdomain_count: Int!
  resolved_address: subgraph_accounts @index
  resolver: subgraph_resolvers
  ttl: BigInt
  is_migrated: Boolean!
  created_at: BigInt!
  owner: subgraph_accounts! @index
  registrant: subgraph_accounts @index
  wrapped_owner: subgraph_accounts @index
  expiry_date: BigInt
  subdomains: [subgraph_domains!]! @derivedFrom(field: "parent")
}

type subgraph_accounts {
  id: ID!
  domains: [subgraph_domains!]! @derivedFrom(field: "owner")
  wrapped_domains: [subgraph_wrapped_domains!]! @derivedFrom(field: "owner")
  registrations: [subgraph_registrations!]! @derivedFrom(field: "registrant")
}

type subgraph_resolvers {
  id: ID!
  domain: subgraph_domains! @index
  address: String!
  addr: subgraph_accounts
  content_hash: String
  texts: [String!]
  coin_types: [BigInt!]
}

type subgraph_registrations {
  id: ID!
  domain: subgraph_domains! @index
  registration_date: BigInt! @index
  expiry_date: BigInt! @index
  cost: BigInt
  registrant: subgraph_accounts!
  label_name: String
}

type subgraph_wrapped_domains {
  id: ID!
  domain: subgraph_domains! @index
  expiry_date: BigInt!
  fuses: Int!
  owner: subgraph_accounts!
  name: String
}

