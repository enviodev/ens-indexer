# ENS HyperIndex Schema
# Migrated from ENSNode Ponder indexer (subgraph plugin)

# ─── Core Entities ───────────────────────────────────────────────────────────

type Domain {
  id: ID!
  name: String
  labelName: String
  labelhash: String @index
  parent: Domain @index
  subdomainCount: Int!
  resolvedAddress: Account @index
  resolver: Resolver
  ttl: BigInt
  isMigrated: Boolean!
  createdAt: BigInt!
  owner: Account! @index
  registrant: Account @index
  wrappedOwner: Account @index
  expiryDate: BigInt
  subdomains: [Domain!]! @derivedFrom(field: "parent")
}

type Account {
  id: ID!
  domains: [Domain!]! @derivedFrom(field: "owner")
  wrappedDomains: [WrappedDomain!]! @derivedFrom(field: "owner")
  registrations: [Registration!]! @derivedFrom(field: "registrant")
}

type Resolver {
  id: ID!
  domain: Domain! @index
  address: String!
  addr: Account
  contentHash: String
  texts: [String!]
  coinTypes: [BigInt!]
}

type Registration {
  id: ID!
  domain: Domain! @index
  registrationDate: BigInt! @index
  expiryDate: BigInt! @index
  cost: BigInt
  registrant: Account!
  labelName: String
}

type WrappedDomain {
  id: ID!
  domain: Domain! @index
  expiryDate: BigInt!
  fuses: Int!
  owner: Account!
  name: String
  isActive: Boolean!
}

# ─── Domain Event Entities ───────────────────────────────────────────────────

type Transfer @index(fields: ["domain", "id"]) {
  id: ID!
  blockNumber: Int!
  transactionID: String!
  domain: Domain! @index
  owner: Account!
}

type NewOwner @index(fields: ["domain", "id"]) {
  id: ID!
  blockNumber: Int!
  transactionID: String!
  domain: Domain! @index
  owner: Account!
