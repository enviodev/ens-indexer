# ENS HyperIndex Schema
# Migrated from ENSNode Ponder indexer (subgraph plugin)

# ─── Core Entities ───────────────────────────────────────────────────────────

# Indexes serve the API's query patterns: exact label search, names by owner /
# registrant sorted by expiry, subdomain listing sorted by creation, per-namespace
# newest and expiring feeds, and global "recently created" / "expiring" feeds.
# NOTE: the plain btree indexes on name / labelName do NOT serve `LIKE 'abc%'`
# prefix search (that needs the text_pattern_ops operator class, which @index
# cannot express). See research/ens-indexer-hiccups-round-2.md in envio-apis.
type subgraph_domain @index(fields: ["owner", "expiryDate"]) @index(fields: ["registrant", "expiryDate"]) @index(fields: ["wrappedOwner", "expiryDate"]) @index(fields: ["effectiveOwner", "expiryDate"]) @index(fields: ["namespace", "createdAt"]) @index(fields: ["namespace", "expiryDate"]) @index(fields: ["parent", "createdAt"]) {
  id: ID!
  name: String @index
  labelName: String @index
  labelhash: String @index
  parent: subgraph_domain @index
  subdomainCount: Int!
  resolvedAddress: subgraph_account @index
  resolver: subgraph_resolver
  ttl: BigInt
  isMigrated: Boolean!
  createdAt: BigInt! @index
  owner: subgraph_account! @index
  registrant: subgraph_account @index
  wrappedOwner: subgraph_account @index
  expiryDate: BigInt @index      # registration expiry + 90 day grace for names under eth, base.eth, linea.eth
  registrationExpiryDate: BigInt # exact registration expiry (no grace); only set for registrar names
  effectiveOwner: subgraph_account! @index  # wrappedOwner when wrapped, else owner
  namespace: String @index       # "eth" | "base" | "linea" | "3dns"; from the registrar root, not the chain. Null for other nodes (reverse, DNS imports)
  subdomains: [subgraph_domain!]! @derivedFrom(field: "parent")
}

type subgraph_account {
  id: ID!
  domains: [subgraph_domain!]! @derivedFrom(field: "owner")
  wrappedDomains: [subgraph_wrapped_domain!]! @derivedFrom(field: "owner")
  registrations: [subgraph_registration!]! @derivedFrom(field: "registrant")
}

type subgraph_resolver {
  id: ID!
  domain: subgraph_domain! @index
  address: String! @index
  addr: subgraph_account @index
  contentHash: String
  texts: [String!]
  coinTypes: [BigInt!]
}

type subgraph_registration @index(fields: ["registrant", "registrationDate"]) {
  id: ID!
  domain: subgraph_domain! @index
  registrationDate: BigInt! @index
  expiryDate: BigInt! @index
  cost: BigInt
  registrant: subgraph_account! @index
  labelName: String @index
}

type subgraph_wrapped_domain {
  id: ID!
  domain: subgraph_domain! @index
  expiryDate: BigInt! @index
  fuses: Int!
  owner: subgraph_account! @index
  name: String
  isActive: Boolean!
}

