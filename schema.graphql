# Address behind a legacy reverse node, from ReverseRegistrar.ReverseClaimed.
type reverse_claim {
  id: ID!                    # reverse node (namehash of "<address>.addr.reverse")
  addr: String!              # lowercase address
}

# Legacy reverse names whose address could not be recovered (no ReverseClaimed,
# and neither the node owner nor the transaction sender hashes to the node
# label). Exists to size the coverage gap: select count(*) from this table.
type unrecovered_reverse_name {
  id: ID!                    # reverse node
  name: String!              # last NameChanged value
  blockNumber: Int!
}

type migrated_node_by_node {
  id: ID!
}

# ─── Registrars Plugin Entities ────────────────────────────────────────────

enum registrar_action_type {
  registration
  renewal
}

type subregistry {
  id: ID!                    # CAIP-10: "eip155:{chainId}:{address}"
  node: String! @index       # namehash of managed name (e.g. ETH_NODE)
}

# Number of registrations expiring on each UTC day, per subregistry, kept in step
# with registration_lifecycle.expiresAt. Lets the API answer expiry-bucket
# questions by summing a small day range instead of grouping millions of rows.
type expiry_day_stat @index(fields: ["subregistryId", "day"]) {
  id: ID!                    # "{subregistryId}:{day}"
  subregistryId: String!
  day: Int!                  # unix day: floor(expiresAt / 86400)
  count: Int!
}

type registration_lifecycle {
  id: ID!                    # node hash (domain namehash)
  subregistryId: String! @index  # FK to subregistry
  expiresAt: BigInt! @index  # Unix timestamp
}

type registrar_action @index(fields: ["node", "timestamp"]) @index(fields: ["owner", "timestamp"]) @index(fields: ["registrant", "timestamp"]) @index(fields: ["decodedReferrer", "timestamp"]) @index(fields: ["subregistryId", "timestamp"]) {
  id: ID!                    # first event ID (from BaseRegistrar event)
  type: registrar_action_type!
  subregistryId: String!     # FK to subregistry
  node: String!              # domain namehash
  incremental_duration: BigInt!
  baseCost: BigInt           # nullable (unknown for some controllers)
  premium: BigInt            # nullable
  total: BigInt @index       # nullable; indexed for minCost / maxCost filters
  registrant: String!        # transaction.from address (the sender, not necessarily the owner)
  owner: String              # owner from the controller event params; null for renewals or when the controller event was not indexed
  encodedReferrer: String    # nullable, raw bytes32
  decodedReferrer: String @index  # nullable, decoded address
  blockNumber: BigInt!
  timestamp: BigInt! @index
  transactionHash: String!
  eventIds: [String!]!       # array of contributing event IDs
}

type internal_registrar_action_metadata {
  id: ID!                    # always "current" (singleton)
  logicalEventKey: String!   # "{node}:{transactionHash}"
  logicalEventId: String!    # ID of registrarAction being built
}

# ─── TokenScope Plugin Entities ──────────────────────────────────────────

type name_token {
  id: ID!                    # CAIP-19 Asset ID
  domainId: String! @index   # namehash (node) of the ENS domain
  contractAddress: String!   # NFT contract address
  tokenId: BigInt!           # token ID in the contract
  assetNamespace: String!    # "erc721" or "erc1155"
  owner: String! @index      # current owner (zeroAddress if burned)
  mintStatus: String!        # "minted" or "burned"
}

type name_sale @index(fields: ["domainId", "timestamp"]) @index(fields: ["currency", "amount"]) {
  id: ID!                    # "{chainId}-{blockNumber}-{logIndex}"
  blockNumber: Int!
  logIndex: Int!
  transactionHash: String!
  orderHash: String!
  contractAddress: String!
  tokenId: BigInt!
  assetNamespace: String!
  assetId: String! @index    # CAIP-19 Asset ID
  domainId: String! @index   # namehash (node)
  buyer: String! @index
  seller: String! @index
  currency: String!          # "ETH", "USDC", "DAI"
  amount: BigInt!            # smallest unit
  timestamp: BigInt! @index
}

# ─── Aggregates (API stats endpoints) ───────────────────────────────────────

# One row per subregistry (a managed namespace such as .eth, .base.eth,
# .linea.eth) per UTC day. Counts are bumped when a registrar action is
# recorded; cost is added when the controller event supplies pricing.
type registration_daily_stat @index(fields: ["subregistryId", "day"]) {
  id: ID!                    # "{subregistryId}:{day}"
  subregistryId: String!     # FK to subregistry
  day: Int! @index           # unix day: floor(timestamp / 86400)
  registrations: Int!
  renewals: Int!
  totalCost: BigInt!         # sum of known totals (wei); unknown costs are not counted
}

# Running totals per subregistry.
type namespace_stat {
  id: ID!                    # subregistry id
  registrations: Int!
  renewals: Int!
  totalCost: BigInt!
}

# Referrer leaderboard, one row per referrer per subregistry. Counted once per
# registrar action, on the first controller event that carries a non-zero
# decoded referrer. totalCost sums known totals only (unknown costs are 0).
type referrer_stat @index(fields: ["subregistryId", "actions"]) {
  id: ID!                    # "{subregistryId}:{referrer}"
  subregistryId: String! @index
  referrer: String! @index   # decoded referrer address (lowercase)
  actions: Int!              # registrations + renewals
  registrations: Int!
  renewals: Int!
  totalCost: BigInt!
}

# Basenames controllers emit ETHPaymentProcessed(payee, price) just before
# NameRegistered / NameRenewed in the same transaction. The price is held here
# until the paired controller event consumes it, then deleted.
type internal_base_payment {
  id: ID!                    # "{chainId}-{transactionHash}"
  price: BigInt!
}
